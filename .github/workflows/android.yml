name: Android

# Builds the Android app and its widget, runs the unit tests, then runs the app in the Android emulator
# with live data (the self-test: forecasts, units, city search online and offline, the widgets' data
# path) and photographs the terms, a city page at rest and scrolled, and the city list. Results go to
# the ci-shots-android branch; the job fails if any check fails. The APKs are kept as an artifact.
on:
  push:
    branches: [main]
    paths: ["android/**", "Resources/Cities.tsv", "VERSION", "scripts/android-selftest.sh", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit-test
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          LOG="$RUNNER_TEMP/gradle.txt"
          if ! ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease testDebugUnitTest > "$LOG" 2>&1; then
            # Compiler errors and failed tests as annotations, then the tail of the log.
            grep -E "^e: |FAILED|AAPT: error|error:" "$LOG" | sort -u | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -60 "$LOG"; exit 1
          fi
          grep -hoE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+"' app/build/test-results/testDebugUnitTest/*.xml \
            | awk -F'"' '{t+=$2; f+=$6} END {print "::notice::Android unit tests: " t " run, " f " failed"}'
          ls -la app/build/outputs/apk/*/ app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        with:
          name: two-degrees-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: scripts/android-selftest.sh android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/shots"
      - name: Publish the results
        if: always()
        run: |
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/commit.txt"
          REPORT="$OUT/report.txt"
          [ -f "$REPORT" ] && grep -E "^FAIL" "$REPORT" | while IFS= read -r line; do echo "::error::${line}"; done
          [ -f "$REPORT" ] && echo "::notice::Android self-test: $(head -1 "$REPORT")"
          cd "$OUT"
          git init -q && git checkout -q -b ci-shots-android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Android CI screenshots for $(cat commit.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots-android
          head -1 report.txt | grep -q "^ALL PASSED"
