name: Build

# main is built by release.yml; this checks pull requests.
on:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests
        run: swift test
      - name: Build app
        run: scripts/build-app.sh 0.0.0-dev
      - name: Package DMG
        run: scripts/make-dmg.sh 0.0.0-dev
      - uses: actions/upload-artifact@v4
        with:
          name: TwoDegrees-dev
          path: dist/*.dmg

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web tests (phone, tablet, desktop × 5 sizes)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/web.test.js
