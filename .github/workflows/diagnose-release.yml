name: Diagnose release widget

# Installs the published Two Degrees release the way a person does, opens it, and reports what macOS
# thinks of its widget: signature, entitlements, Gatekeeper, registration and the widget's own log.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-release.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compare what chronod does with each build's widget
        run: |
          exec > >(tee /tmp/report.txt) 2>&1
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          A=/Applications/TwoDegrees.app; W=$A/Contents/PlugIns/TwoDegreesWidget.appex
          trial() {   # $1 = label; the app to try is at /tmp/try/TwoDegrees.app
            pkill -x TwoDegrees || true; sleep 1
            rm -rf $A; ditto /tmp/try/TwoDegrees.app $A
            "$LSREG" -f -R $A; open $A; sleep 8
            echo "== $1: $(plutil -extract CFBundleShortVersionString raw $A/Contents/Info.plist), $(codesign -dvv $W 2>&1 | grep -m1 Authority || echo ad-hoc)"
            log show --last 12s --style compact --predicate 'process == "chronod" AND eventMessage CONTAINS[c] "twodegrees"' \
              | grep -E "shouldn't cache|Added extensions|descriptor|error|fail" | grep -v '^Timestamp' | cut -c1-330 | tail -6
          }
          dmg() { rm -rf /tmp/try; mkdir -p /tmp/try; curl -fsSL -o /tmp/x.dmg "$1"; hdiutil attach -nobrowse -quiet -mountpoint /tmp/m /tmp/x.dmg; ditto /tmp/m/TwoDegrees.app /tmp/try/TwoDegrees.app; hdiutil detach -quiet /tmp/m; }
          dmg https://github.com/bradleycowdrey/two-degrees/releases/download/v0.3.5/TwoDegrees-0.3.5.dmg; trial "0.3.5 release (ad-hoc)"
          dmg https://github.com/bradleycowdrey/two-degrees/releases/latest/download/TwoDegrees.dmg; trial "latest release (Developer ID)"
          scripts/build-app.sh 0.0.0-diag >/dev/null; rm -rf /tmp/try; mkdir -p /tmp/try; ditto dist/TwoDegrees.app /tmp/try/TwoDegrees.app; trial "built here (ad-hoc)"
          echo "== widget descriptors chronod knows"; log show --last 2m --style compact --predicate 'process == "chronod" AND eventMessage CONTAINS[c] "descriptor"' | grep -ci twodegrees
      - name: Publish to ci-diagnose branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp /tmp/report.txt /tmp/out/ && cd /tmp/out
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-diagnose
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Release diagnostics for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-diagnose
