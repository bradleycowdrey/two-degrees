name: Diagnose release widget

# Installs the published Two Degrees release the way a person does, opens it, and reports what macOS
# thinks of its widget: signature, entitlements, Gatekeeper, registration and the widget's own log.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-release.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - name: Install the latest release and test what makes chronod keep its widget
        run: |
          exec > >(tee /tmp/report.txt) 2>&1
          curl -fsSL -o /tmp/td.dmg https://github.com/bradleycowdrey/two-degrees/releases/latest/download/TwoDegrees.dmg
          hdiutil attach -nobrowse -quiet -mountpoint /tmp/td /tmp/td.dmg
          echo "== dates inside the DMG"; stat -f '%Sm  %N' /tmp/td/TwoDegrees.app /tmp/td/TwoDegrees.app/Contents /tmp/td/TwoDegrees.app/Contents/PlugIns/TwoDegreesWidget.appex /tmp/td/TwoDegrees.app/Contents/PlugIns/TwoDegreesWidget.appex/Contents/Info.plist
          ditto /tmp/td/TwoDegrees.app /Applications/TwoDegrees.app
          hdiutil detach -quiet /tmp/td
          A=/Applications/TwoDegrees.app; W=$A/Contents/PlugIns/TwoDegreesWidget.appex
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          echo "== dates installed"; stat -f '%Sm  %N' $A $W $W/Contents/Info.plist
          chrono() { sleep 6; log show --last "$1" --style compact --predicate 'process == "chronod" AND eventMessage CONTAINS[c] "twodegrees"' | grep -v '^Timestamp' | cut -c1-400 | tail -12; }
          echo "== A: as released"; open $A; chrono 20s
          osascript -e 'quit app "TwoDegrees"' || pkill -x TwoDegrees || true
          echo "== B: same app, files given today's date"
          find $A -exec touch -h {} +
          stat -f '%Sm  %N' $A $W
          codesign --verify --deep --strict $A && echo "signature still valid"
          "$LSREG" -f -R $A; open $A; chrono 20s
          echo "== pluginkit"; pluginkit -m -v -i com.bradcowdrey.twodegrees.widget || true
          echo "== the self-test build (ad-hoc, built here) for comparison"
          echo "(see the Self-test workflow)"
      - name: Publish to ci-diagnose branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp /tmp/report.txt /tmp/out/ && cd /tmp/out
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-diagnose
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Release diagnostics for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-diagnose
