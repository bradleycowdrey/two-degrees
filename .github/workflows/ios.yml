name: iPhone

# Builds the iPhone app and its widget, runs it in the iOS Simulator with live data (--selftest:
# forecasts, units, city search, the widget's data path, every widget size drawn), and photographs
# the first-launch terms, the main screen and the 5-day forecast. Results go to the ci-shots-ios
# branch; the job fails if any check fails.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build for the Simulator
        run: scripts/build-ios.sh 0.0.0-ci
      - name: Check the packaged widget
        run: |
          W=dist/ios/TwoDegrees.app/PlugIns/TwoDegreesWidget.appex
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$W/Info.plist" | grep -q com.apple.widgetkit-extension \
            || { echo "::error::The iPhone widget isn't declared as a WidgetKit extension"; exit 1; }
          find "$W" -name Metadata.appintents | grep -q . || { echo "::error::The iPhone widget has no App Intents metadata; its city setting won't show"; exit 1; }
          test -f dist/ios/TwoDegrees.app/Assets.car || { echo "::error::The iPhone app has no asset catalog (icon)"; exit 1; }
      - name: Run in the Simulator
        run: |
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          phones=[(r,x) for r,xs in d.items() if "iOS" in r for x in xs if x["name"].startswith("iPhone")]
          phones.sort(key=lambda p:(p[0], "Pro" in p[1]["name"] and "Max" not in p[1]["name"]))
          print(phones[-1][1]["udid"])')
          xcrun simctl list devices | grep "$DEVICE" | tee "$OUT/device.txt"
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" dist/ios/TwoDegrees.app
          ID=com.bradcowdrey.twodegrees
          # 1. First launch: the terms.
          xcrun simctl launch "$DEVICE" $ID; sleep 6
          xcrun simctl io "$DEVICE" screenshot "$OUT/phone-1-terms.png"
          xcrun simctl terminate "$DEVICE" $ID || true
          # 2. The self-test, then the main screen.
          DOCS="$(xcrun simctl get_app_container "$DEVICE" $ID data)/Documents"; mkdir -p "$DOCS"; rm -f "$DOCS/report.txt"
          xcrun simctl launch "$DEVICE" $ID --selftest
          for i in $(seq 1 120); do [ -f "$DOCS/report.txt" ] && break; sleep 1; done
          sleep 2; xcrun simctl io "$DEVICE" screenshot "$OUT/phone-2-main.png"
          xcrun simctl terminate "$DEVICE" $ID || true
          cp "$DOCS"/*.png "$DOCS/report.txt" "$OUT/" 2>/dev/null || true
          # 3. The five-day forecast, opened.
          rm -f "$DOCS/report.txt"
          xcrun simctl launch "$DEVICE" $ID --selftest --show-days
          for i in $(seq 1 120); do [ -f "$DOCS/report.txt" ] && break; sleep 1; done
          sleep 3; xcrun simctl io "$DEVICE" screenshot "$OUT/phone-3-five-days.png"
          cat "$OUT/report.txt" 2>/dev/null || echo "no report"
      - name: Publish to ci-shots-ios branch
        if: always() && github.event_name != 'pull_request'
        run: |
          cd "$RUNNER_TEMP/shots"
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-shots-ios
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "iPhone self-test for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots-ios
      - name: Fail on any failed check
        run: head -1 "$RUNNER_TEMP/shots/report.txt" | grep -q "ALL PASSED"
