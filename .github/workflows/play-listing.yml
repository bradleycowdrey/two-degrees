name: Google Play listing

# Sends the Google Play store listing in docs/play (the text in listing.json, the icon, the feature graphic
# and the phone screenshots) to Play Console whenever it changes on main, or when run by hand. New builds go
# to the closed test from android.yml. Without the PLAY_SERVICE_ACCOUNT_JSON secret this does nothing.
on:
  push:
    branches: [main]
    paths: ["docs/play/**", ".github/scripts/play_publish.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Google Play store listing
        if: env.HAS_PLAY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE: com.bradcowdrey.twodegrees
        run: |
          pip install --quiet pyjwt cryptography
          python3 .github/scripts/play_publish.py
      - name: No Play key yet
        if: env.HAS_PLAY != 'true'
        run: echo "No PLAY_SERVICE_ACCOUNT_JSON secret, so nothing was sent to Google Play (docs/play/README.md)."
