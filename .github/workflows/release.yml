name: Release

# Every push to main with an unreleased VERSION builds Two Degrees and releases it as v<VERSION>,
# plus a stable TwoDegrees.dmg so https://github.com/bradleycowdrey/two-degrees/releases/latest/download/TwoDegrees.dmg
# always serves the newest build. Bump VERSION for a new release; a published version is never replaced.
#
# Signed releases (Developer ID secrets present) happen in two steps, because Apple's notarization can
# take hours: this workflow builds and signs the app, submits it to Apple without waiting, and keeps
# the build as a "pending-release-<tag>" artifact. finish-release.yml checks Apple every 30 minutes
# and, once Apple accepts, staples the ticket, builds the DMG, checks Gatekeeper and publishes.
# Without the secrets the app is ad-hoc signed and published right away, as before.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_SIGNING_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version, and whether there's anything to do
        id: state
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do. Bump VERSION to release new code."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=pending-release-$TAG" -q '.artifacts[]|select(.expired|not)|.id')" ]]; then
            echo "::notice::$TAG is already with Apple for notarization; finish-release.yml publishes it once Apple accepts. Bump VERSION to release newer code."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.state.outputs.skip != 'true' && env.HAS_SIGNING_CERT == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/import-signing-cert.sh

      - name: Build
        if: steps.state.outputs.skip != 'true'
        run: scripts/build-app.sh "$TAG"

      # Unsigned path: package and publish now.
      - name: Package and publish (ad-hoc signed)
        if: steps.state.outputs.skip != 'true' && env.HAS_SIGNING_CERT != 'true'
        run: |
          scripts/make-dmg.sh "$TAG"
          cp dist/TwoDegrees-*.dmg dist/TwoDegrees.dmg
          scripts/publish-release.sh "$TAG" "$GITHUB_SHA"

      # Signed path: submit the app to Apple and keep the build until Apple accepts it.
      - name: Submit to Apple for notarization
        if: steps.state.outputs.skip != 'true' && env.HAS_SIGNING_CERT == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          TEAM="${NOTARY_TEAM_ID:-$DERIVED_TEAM_ID}"
          mkdir -p pending
          ditto -c -k --keepParent dist/TwoDegrees.app pending/TwoDegrees.app.zip
          OUT="$(xcrun notarytool submit pending/TwoDegrees.app.zip --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$TEAM" --output-format json)"
          echo "$OUT"
          ID="$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          printf '{"tag": "%s", "sha": "%s", "submission": "%s"}\n' "$TAG" "$GITHUB_SHA" "$ID" > pending/release.json
          cat pending/release.json
          echo "::notice::$TAG submitted to Apple (submission $ID). finish-release.yml publishes it once Apple accepts; it checks every 30 minutes."

      - name: Keep the build until Apple accepts it
        if: steps.state.outputs.skip != 'true' && env.HAS_SIGNING_CERT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pending-release-${{ env.TAG }}
          path: pending/
          retention-days: 30
