name: Self-test

# Builds the app on a real Mac and runs `TwoDegrees --selftest`: live data, every size and
# state, city add/remove, window positions, a real update check + download + checksum +
# unpack, the Dock tile and all widget sizes. Unit tests run first. The report and
# screenshots are published to the ci-shots branch; the job fails if any check fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/unit-tests.txt"
      - name: Build
        run: scripts/build-app.sh 0.0.0-selftest
      - name: Check the packaged widget
        run: |
          # What macOS needs to run the widget at all: its sandbox and network entitlements survive
          # signing, its settings (App Intents) metadata is inside, and it registers as a widget.
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          W=dist/TwoDegrees.app/Contents/PlugIns/TwoDegreesWidget.appex
          {
            echo "== entitlements"; codesign -d --entitlements - --xml "$W" 2>/dev/null | plutil -convert xml1 -o - - || true
            echo "== App Intents metadata"; find "$W" -name 'Metadata.appintents' -print
            echo "== extension point"; plutil -extract NSExtension.NSExtensionPointIdentifier raw "$W/Contents/Info.plist"
          } > "$OUT/widget-package.txt" 2>&1
          cat "$OUT/widget-package.txt"
          grep -q 'com.apple.security.app-sandbox' "$OUT/widget-package.txt" || { echo "::error::The widget lost its sandbox entitlement; macOS won't run it"; exit 1; }
          grep -q 'com.apple.security.network.client' "$OUT/widget-package.txt" || { echo "::error::The widget lost its network entitlement; it can't fetch the weather"; exit 1; }
          grep -q 'Metadata.appintents' "$OUT/widget-package.txt" || { echo "::error::The widget has no App Intents metadata; macOS can't read its city setting"; exit 1; }
          grep -q '2XV97FZ86G.com.bradcowdrey.twodegrees' "$OUT/widget-package.txt" || { echo "::error::The widget lost its App Group; it can't follow the app's cities"; exit 1; }
          codesign -d --entitlements - --xml dist/TwoDegrees.app 2>/dev/null | plutil -convert xml1 -o - - | grep -q '2XV97FZ86G.com.bradcowdrey.twodegrees' || { echo "::error::The app lost its App Group; widgets can't follow its cities"; exit 1; }
          grep -q 'com.apple.widgetkit-extension' "$OUT/widget-package.txt" || { echo "::error::The widget isn't declared as a WidgetKit extension"; exit 1; }
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$LSREG" -f -R "$PWD/dist/TwoDegrees.app" || true
          pluginkit -a "$W" || true
          sleep 2
          echo "== pluginkit" >> "$OUT/widget-package.txt"
          pluginkit -m -v -i com.bradcowdrey.twodegrees.widget >> "$OUT/widget-package.txt" 2>&1 || true
          tail -3 "$OUT/widget-package.txt"
      - name: Update in place keeps macOS's app registry current
        run: |
          # The real-world path: v0.3.4 installed, then updated in place by the new app's own install
          # script. macOS must then have the new build number registered, or it rejects the widget's
          # content ("Bundle version did not match") and the widget stays blank.
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"; T="$RUNNER_TEMP/inplace"; mkdir -p "$T"
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          curl -fsSL -o "$T/old.dmg" https://github.com/bradleycowdrey/two-degrees/releases/download/v0.3.4/TwoDegrees-0.3.4.dmg
          NEWV=$(plutil -extract CFBundleVersion raw dist/TwoDegrees.app/Contents/Info.plist)
          dist/TwoDegrees.app/Contents/MacOS/TwoDegrees --print-install-script | sed 's#^/usr/bin/open .*#true#' > "$T/install.sh"
          record() {   # the LaunchServices record for this exact app path
            "$LSREG" -dump | P="$1" perl -0777 -ne 'for (split /-{20,}\n/) { if (/^path:\s+\Q$ENV{P}\E \(/m) { print; last } }'
          }
          try() {   # $1 = label, $2 = install script
            rm -rf "$T/app" "$T/mnt"; mkdir -p "$T/app"
            hdiutil attach -nobrowse -quiet -mountpoint "$T/mnt" "$T/old.dmg"
            ditto "$T/mnt/TwoDegrees.app" "$T/app/TwoDegrees.app"; hdiutil detach -quiet "$T/mnt"
            "$LSREG" -f "$T/app/TwoDegrees.app"
            sh "$2" 999999 "$T/app/TwoDegrees.app" "$PWD/dist/TwoDegrees.app"
            echo "== $1 (new build $NEWV)"; record "$T/app/TwoDegrees.app" | grep -E '^(path|version|identifier|CFBundleVersion)' || record "$T/app/TwoDegrees.app" | head -40
          }
          grep -v 'lsregister -f' "$T/install.sh" > "$T/install-old.sh"
          { try "old install script (no lsregister)" "$T/install-old.sh"; try "new install script" "$T/install.sh"; } > "$OUT/update-in-place.txt" 2>&1
          cat "$OUT/update-in-place.txt"
          sed -n '/== new install script/,$p' "$OUT/update-in-place.txt" | grep -E "version: +.*\b$NEWV\b|CFBundleVersion.*\b$NEWV\b" \
            || { echo "::error::After an update in place, macOS still doesn't have build $NEWV registered"; exit 1; }
      - name: Run self-test
        run: |
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          cp "$RUNNER_TEMP/unit-tests.txt" "$OUT/" || true
          dist/TwoDegrees.app/Contents/MacOS/TwoDegrees --selftest "$OUT" > "$OUT/app.log" 2>&1 &
          PID=$!
          for i in $(seq 1 300); do [ -f "$OUT/report.txt" ] && break; sleep 1; done
          sleep 1; kill $PID 2>/dev/null || true
          cat "$OUT/report.txt" 2>/dev/null || echo "no report"
      - name: Publish to ci-shots branch
        if: always()
        run: |
          cd "$RUNNER_TEMP/shots"
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-shots
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Self-test for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
      - name: Fail on any failed check
        run: |
          [ "${{ steps.unit.outcome }}" = "success" ] || { echo "Unit tests failed"; exit 1; }
          head -1 "$RUNNER_TEMP/shots/report.txt" | grep -q "ALL PASSED"

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web tests (phone, tablet, desktop × 5 sizes)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          # One retry for the occasional flaky run; any failing check is listed as an annotation.
          node tests/web.test.js > web.txt 2>&1 || { grep -E '^FAIL' web.txt | sed 's/^/::warning::retrying after: /'; node tests/web.test.js > web.txt 2>&1; } || { grep -E '^FAIL' web.txt | sed 's/^/::error::/'; tail -5 web.txt; exit 1; }
          tail -1 web.txt
