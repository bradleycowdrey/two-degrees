name: TestFlight public link

# Shares the iPhone and iPad app through a public TestFlight link until the App Store listing is live:
# fills in the beta test information and Beta App Review contact, adds the build to the external group
# "Public", submits it for Beta App Review, and turns on the group's public link. Runs after each
# successful iPhone TestFlight upload, every six hours, or on demand. Safe to run again: it only does what's missing.
# Once the link exists it is saved to docs/testflight.json on main, which turns the product pages'
# "Coming soon" into a Get it on TestFlight button. Uses the same App Store Connect API key as the
# upload, and App Review's contact from the APP_REVIEW_PHONE and APP_REVIEW_EMAIL secrets, or else the
# contact already on the App Store submission. Without the key this does nothing.
on:
  # Every six hours too, to turn on and report the link once Beta App Review approves a build.
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["iPhone TestFlight"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build:
        description: "Build number to share (empty: the newest processed build)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: testflight-public
  cancel-in-progress: false

jobs:
  public:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
    steps:
      - name: Waiting for the App Store Connect key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::No App Store Connect API key yet (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8), so nothing to share."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          # After an upload, the commit it built, with full history to work out its build number.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Share the build
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CONTACT_NAME: Bradley Cowdrey
          CONTACT_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
          CONTACT_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          INPUT_BUILD: ${{ inputs.build }}
          LINK_FILE: ${{ runner.temp }}/testflight.json
          EVENT: ${{ github.event_name }}
        run: |
          # The upload numbers each build by the commits on main, so the build it just sent is this count.
          # Apple takes a while to process a new upload, so wait for it.
          if [[ "$EVENT" == "workflow_run" ]]; then
            export BUILD="$(git rev-list --count HEAD)" WAIT_MINUTES=45
          else
            export BUILD="$INPUT_BUILD" WAIT_MINUTES=0
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.9.0"
          cd scripts && "$RUNNER_TEMP/venv/bin/python" appstore_testflight_public.py
      - name: Save the link for the download buttons
        if: env.HAS_KEY == 'true'
        run: |
          [[ -f "$RUNNER_TEMP/testflight.json" ]] || { echo "No public link yet."; exit 0; }
          git fetch --quiet origin main
          git checkout --quiet -B save-link origin/main
          if cmp -s "$RUNNER_TEMP/testflight.json" docs/testflight.json; then echo "Link unchanged."; exit 0; fi
          cp "$RUNNER_TEMP/testflight.json" docs/testflight.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testflight.json
          git commit --quiet -m "The public TestFlight link for the download buttons"
          git push --quiet origin HEAD:main
          echo "::notice::Saved the TestFlight link to docs/testflight.json."
