<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain Map · Two Degrees</title>
<link rel="icon" href="https://raw.githubusercontent.com/bradleycowdrey/two-degrees/main/docs/icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
  /* The rain map every Two Degrees app opens: radar from RainViewer on a dark OpenFreeMap map (free, no
     key, made from OpenStreetMap data), the past two hours plus any short forecast the radar service
     offers, with play and a time slider. ?lat=..&lon=..&z=7
     The apps put their close button at the top left, so the zoom buttons sit at the top right and the
     credit line sits just above the time bar. */
  :root { color-scheme: dark; --bg: #1A1816; --tile: #23201D; --text: #FFFFFF; --muted: #B0A898; --cream: #FFF1E5; --rain: #8DB4E2; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 500 15px/1.3 -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif; }
  #map { position: fixed; inset: 0; background: var(--bg); }
  .bottom { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 500;
    display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px;
    background: rgba(35,32,29,.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .bar[hidden] { display: none; }
  .bar button { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--cream); color: var(--bg); cursor: pointer; display: grid; place-items: center; }
  .bar button svg { width: 16px; height: 16px; }
  .bar input { flex: 1; accent-color: var(--rain); min-width: 0; }
  .bar .t { flex: none; min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
  .bar .t small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }
  .credit { align-self: flex-end; max-width: 100%; font-size: 10.5px; line-height: 1.35; color: var(--muted); text-align: right;
    background: rgba(26,24,22,.75); padding: 3px 8px; border-radius: 8px; }
  .credit a { color: inherit; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); z-index: 600; }
  .msg[hidden] { display: none; }
  .here { width: 14px; height: 14px; border-radius: 50%; background: var(--cream); border: 3px solid #E04A7A; box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
  .maplibregl-ctrl-top-right { top: env(safe-area-inset-top, 0px); }
  .maplibregl-ctrl-group { background: rgba(35,32,29,.88) !important; }
  .maplibregl-ctrl-group button + button { border-top-color: rgba(255,255,255,.12) !important; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
</style>
</head>
<body>
<div id="map" role="img" aria-label="Rain map"></div>
<div class="bottom">
  <div class="credit">Radar © <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a> · Map <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org" target="_blank" rel="noopener">OpenMapTiles</a> · Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
  <div class="bar" id="bar" hidden>
    <button type="button" id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Time">
    <div class="t" id="time"></div>
  </div>
</div>
<div class="msg" id="msg">Loading the rain map…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  const num = (k, d) => { const v = parseFloat(q.get(k)); return Number.isFinite(v) ? v : d; };
  const lat = num('lat', 39.74), lon = num('lon', -104.98), zoom = Math.min(10, Math.max(3, num('z', 7)));
  const msg = document.getElementById('msg');
  const say = (text) => { msg.textContent = text; msg.hidden = false; };
  if (typeof maplibregl === 'undefined') { say('The map needs an internet connection.'); return; }

  // OpenFreeMap: free for any use, no key and no limits. Dark first; Fiord (dark blue) if Dark is missing.
  const styles = ['https://tiles.openfreemap.org/styles/dark', 'https://tiles.openfreemap.org/styles/fiord'];
  let styleIndex = 0;
  const map = new maplibregl.Map({
    container: 'map', style: styles[0], center: [lon, lat], zoom: zoom - 1, minZoom: 2, maxZoom: 10,
    attributionControl: false, dragRotate: false, pitchWithRotate: false, touchPitch: false,
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  const dot = document.createElement('div'); dot.className = 'here';
  new maplibregl.Marker({ element: dot }).setLngLat([lon, lat]).addTo(map);

  let styleReady = false;
  map.on('error', (e) => {
    if (!styleReady && styleIndex + 1 < styles.length && /style/i.test(String(e && e.error && e.error.message))) {
      map.setStyle(styles[++styleIndex]);
    }
  });

  const timeFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  let frames = [], index = 0, timer = null, host = '';
  const nowIndex = () => { const i = frames.findIndex((f) => f.nowcast); return i < 0 ? frames.length - 1 : Math.max(0, i - 1); };
  const layerId = (i) => `radar-${i}`;

  function show(i) {
    index = (i + frames.length) % frames.length;
    frames.forEach((_, j) => { if (map.getLayer(layerId(j))) map.setPaintProperty(layerId(j), 'raster-opacity', j === index ? 0.75 : 0); });
    const f = frames[index];
    const mins = Math.round((f.time * 1000 - Date.now()) / 60000);
    const when = Math.abs(mins) < 5 ? 'Now' : mins < 0 ? `${-mins} min ago` : `In ${mins} min`;
    document.getElementById('time').innerHTML = `${timeFmt.format(new Date(f.time * 1000))}<small>${when}${f.nowcast ? ' · forecast' : ''}</small>`;
    document.getElementById('slider').value = index;
  }
  function setPlaying(on) {
    clearInterval(timer); timer = null;
    const btn = document.getElementById('play');
    btn.setAttribute('aria-label', on ? 'Pause' : 'Play');
    btn.innerHTML = on ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'
                       : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
    if (on) timer = setInterval(() => show(index + 1), 700);
  }
  // Radar goes under the place names so they stay readable.
  function addRadar() {
    const labels = (map.getStyle().layers || []).find((l) => l.type === 'symbol');
    frames.forEach((f, i) => {
      if (map.getSource(layerId(i))) return;
      map.addSource(layerId(i), { type: 'raster', tiles: [`${host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`], tileSize: 256, maxzoom: 7,
        attribution: '' });
      map.addLayer({ id: layerId(i), type: 'raster', source: layerId(i), paint: { 'raster-opacity': 0, 'raster-fade-duration': 0 } }, labels && labels.id);
    });
    show(index);
  }

  const radar = fetch('https://api.rainviewer.com/public/weather-maps.json', { signal: AbortSignal.timeout(10000) })
    .then((r) => r.json())
    .then((data) => {
      host = data.host;
      frames = [...(data.radar.past || []), ...(data.radar.nowcast || []).map((f) => ({ ...f, nowcast: true }))];
      if (!frames.length) throw new Error('no frames');
      index = nowIndex();
    });
  const styled = new Promise((resolve) => map.on('load', () => { styleReady = true; resolve(); }));

  Promise.all([radar, styled])
    .then(() => {
      addRadar();
      map.on('styledata', () => { if (frames.length && !map.getLayer(layerId(0))) addRadar(); });
      const slider = document.getElementById('slider');
      slider.max = frames.length - 1;
      slider.addEventListener('input', () => { setPlaying(false); show(+slider.value); });
      document.getElementById('play').addEventListener('click', () => setPlaying(timer == null));
      document.getElementById('bar').hidden = false;
      msg.hidden = true;
      show(index);
    })
    .catch(() => say('The rain map isn’t available right now. It needs an internet connection.'));
})();
</script>
</body>
</html>
