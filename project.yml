# XcodeGen spec: the Mac app and the iPhone app, each with its WidgetKit extension.
# scripts/build-app.sh and scripts/build-ios.sh generate TwoDegrees.xcodeproj from this (the project
# file itself isn't committed).
name: TwoDegrees
options:
  bundleIdPrefix: com.bradcowdrey
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  # The Mac app. One target, two variants chosen at build time:
  # - Developer ID (scripts/build-app.sh, release.yml): built as is, then signed with Resources/App.entitlements
  #   and notarized; it updates itself from GitHub.
  # - Mac App Store: the workflow passes SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) MAC_APP_STORE' and
  #   TWO_DEGREES_APP_ENTITLEMENTS=Resources/AppStore.entitlements (sandboxed, no updater), with automatic
  #   signing. The full list is at the top of Resources/AppStore.entitlements.
  TwoDegrees:
    type: application
    platform: macOS
    sources:
      - path: Sources/TwoDegrees
      - path: Resources/Cities.tsv
        buildPhase: resources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # The App Store takes the Mac icon from an asset catalog; the DMG build also writes AppIcon.icns.
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TwoDegrees
        PRODUCT_BUNDLE_IDENTIFIER: com.bradcowdrey.twodegrees
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty for the Developer ID build, which scripts/build-app.sh signs afterwards. A setting of its own,
        # so the App Store build can set the app's entitlements without touching the widget's.
        TWO_DEGREES_APP_ENTITLEMENTS: ""
        CODE_SIGN_ENTITLEMENTS: "$(TWO_DEGREES_APP_ENTITLEMENTS)"
    dependencies:
      - target: TwoDegreesWidget
        embed: true
    scheme: {}
  TwoDegreesWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/TwoDegreesWidget
      - path: Sources/TwoDegrees/Model/Weather.swift
      - path: Sources/TwoDegrees/Model/WidgetData.swift
      - path: Sources/TwoDegrees/Model/OfflineCities.swift
      - path: Resources/Cities.tsv
        buildPhase: resources
      - path: Sources/TwoDegrees/Views/Palette.swift
      - path: Sources/TwoDegrees/Views/WeatherSymbol.swift
      - path: Sources/TwoDegrees/Views/Sky.swift
      - path: Sources/TwoDegrees/Views/WidgetViews.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TwoDegreesWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.bradcowdrey.twodegrees.widget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Widget.entitlements
        SKIP_INSTALL: YES

  # The iPhone app: the same city page (cards and tiles), store, forecast and widget code as the Mac app.
  # Shared files are listed one by one: a new file under Sources/TwoDegrees that the iPhone uses goes here too.
  TwoDegreesPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources/TwoDegreesPhone
      - path: Sources/TwoDegrees/Brand.swift
      - path: Sources/TwoDegrees/Model/LocationService.swift
      - path: Sources/TwoDegrees/Model/TermsSchedule.swift
      - path: Sources/TwoDegrees/Model/WeatherExtras.swift
      - path: Sources/TwoDegrees/Model/Notifier.swift
      - path: Sources/TwoDegrees/Model/Weather.swift
      - path: Sources/TwoDegrees/Model/WeatherStore.swift
      - path: Sources/TwoDegrees/Model/WidgetData.swift
      - path: Sources/TwoDegrees/Model/OfflineCities.swift
      - path: Resources/Cities.tsv
        buildPhase: resources
      - path: Sources/TwoDegrees/Views/Palette.swift
      - path: Sources/TwoDegrees/Views/PanelParts.swift
      - path: Sources/TwoDegrees/Views/CityCards.swift
      - path: Sources/TwoDegrees/Views/Tiles.swift
      - path: Sources/TwoDegrees/Views/TileGraphics.swift
      - path: Sources/TwoDegrees/Views/DayCharts.swift
      - path: Sources/TwoDegrees/Views/Sky.swift
      - path: Sources/TwoDegrees/Views/WeatherSymbol.swift
      - path: Sources/TwoDegrees/Views/WidgetViews.swift
      - path: Resources/iOS/Assets.xcassets
      - path: Resources/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TwoDegrees
        PRODUCT_BUNDLE_IDENTIFIER: com.bradcowdrey.twodegrees
        INFOPLIST_FILE: Resources/iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/iOS/App.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: TwoDegreesPhoneWidget
        embed: true
    scheme: {}
  TwoDegreesPhoneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/TwoDegreesWidget
      - path: Sources/TwoDegrees/Model/Weather.swift
      - path: Sources/TwoDegrees/Model/WidgetData.swift
      - path: Sources/TwoDegrees/Model/OfflineCities.swift
      - path: Resources/Cities.tsv
        buildPhase: resources
      - path: Sources/TwoDegrees/Views/Palette.swift
      - path: Sources/TwoDegrees/Views/Sky.swift
      - path: Sources/TwoDegrees/Views/WeatherSymbol.swift
      - path: Sources/TwoDegrees/Views/WidgetViews.swift
      - path: Resources/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TwoDegreesWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.bradcowdrey.twodegrees.widget
        INFOPLIST_FILE: Resources/iOS/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/iOS/Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
