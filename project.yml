# XcodeGen spec: the app plus its WidgetKit extension. scripts/build-app.sh generates
# TwoDegrees.xcodeproj from this (the project file itself isn't committed).
name: TwoDegrees
options:
  bundleIdPrefix: com.bradcowdrey
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  TwoDegrees:
    type: application
    platform: macOS
    sources:
      - path: Sources/TwoDegrees
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TwoDegrees
        PRODUCT_BUNDLE_IDENTIFIER: com.bradcowdrey.twodegrees
        INFOPLIST_FILE: Resources/Info.plist
    dependencies:
      - target: TwoDegreesWidget
        embed: true
    scheme: {}
  TwoDegreesWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/TwoDegreesWidget
      - path: Sources/TwoDegrees/Model/Weather.swift
      - path: Sources/TwoDegrees/Model/WidgetData.swift
      - path: Sources/TwoDegrees/Views/Palette.swift
      - path: Sources/TwoDegrees/Views/WeatherSymbol.swift
      - path: Sources/TwoDegrees/Views/WidgetViews.swift
    settings:
      base:
        PRODUCT_NAME: TwoDegreesWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.bradcowdrey.twodegrees.widget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Widget.entitlements
        SKIP_INSTALL: YES
